<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교회 재정 관리 — A4 전단지</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --green:#2f6f4f; --green-d:#1f5238; --green-l:#3f8a63;
    --ink:#16241c; --muted:#5a6b61; --soft:#eef5f0; --line:#d3e3d8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body{
    background:#9aa5b1; color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    display:flex; justify-content:center; padding:16px;
  }

  .page{
    position:relative; width:210mm; height:297mm; overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, #f3f9f5 0%, #ffffff 46%, #ffffff 100%);
    padding:16mm 16mm 12mm;
    display:flex; flex-direction:column; align-items:center;
    box-shadow:0 4px 28px rgba(0,0,0,.28);
  }
  /* 배경 장식 — 은은한 그린 블롭 */
  .page::before,.page::after{ content:""; position:absolute; border-radius:50%; z-index:0; }
  .page::before{ width:360px; height:360px; top:-120px; left:-120px;
    background:radial-gradient(circle, rgba(47,111,79,.10), transparent 70%); }
  .page::after{ width:420px; height:420px; bottom:-150px; right:-150px;
    background:radial-gradient(circle, rgba(47,111,79,.08), transparent 70%); }
  .page > *{ position:relative; z-index:1; }

  /* 상단 브랜드 */
  .brand{ display:flex; align-items:center; gap:13px; }
  .brand img{ width:60px; height:60px; border-radius:15px; box-shadow:0 4px 12px rgba(0,0,0,.12); }
  .brand .nm{ font-size:24px; font-weight:800; letter-spacing:-.5px; }
  .brand .nm small{ display:block; font-size:14px; font-weight:600; color:var(--muted); margin-top:2px; }

  /* 헤드라인 */
  .hero{ margin-top:14mm; text-align:center; }
  .hero h1{ font-size:62px; line-height:1.12; letter-spacing:-2.5px; font-weight:800; }
  .hero h1 b{ color:var(--green); }
  .hero p{ margin-top:14px; font-size:23px; font-weight:600; color:var(--muted); letter-spacing:-.5px; }

  /* 중앙 QR — 페이지의 주인공 */
  .scan{ margin:auto 0; display:flex; flex-direction:column; align-items:center; }
  .scan .cue{ font-size:30px; font-weight:800; color:var(--green-d); letter-spacing:-1px; margin-bottom:9mm; }
  .scan .cue span{ display:inline-block; transform:translateY(3px); margin-right:6px; }

  .qrframe{ position:relative; padding:10mm; background:#fff; border-radius:26px;
    box-shadow:0 18px 44px rgba(31,82,56,.20); }
  .qrframe img{ width:96mm; height:96mm; display:block; border-radius:6px; }
  /* 스캔 코너 마커 */
  .qrframe .corner{ position:absolute; width:26px; height:26px; border:5px solid var(--green); }
  .qrframe .tl{ top:14px; left:14px; border-right:0; border-bottom:0; border-top-left-radius:8px; }
  .qrframe .tr{ top:14px; right:14px; border-left:0; border-bottom:0; border-top-right-radius:8px; }
  .qrframe .bl{ bottom:14px; left:14px; border-right:0; border-top:0; border-bottom-left-radius:8px; }
  .qrframe .br{ bottom:14px; right:14px; border-left:0; border-top:0; border-bottom-right-radius:8px; }

  .scan .sub{ margin-top:9mm; font-size:21px; font-weight:600; color:var(--muted); letter-spacing:-.5px; text-align:center; }
  .scan .pill{ margin-top:7mm; display:inline-flex; align-items:center; gap:9px;
    background:var(--green); color:#fff; font-size:19px; font-weight:800; letter-spacing:-.5px;
    padding:12px 24px; border-radius:999px; box-shadow:0 8px 20px rgba(47,111,79,.30); }

  /* 하단 */
  .foot{ margin-top:auto; width:100%; padding-top:6mm; border-top:1.5px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    font-size:15px; font-weight:600; color:var(--muted); }
  .foot .url{ font-weight:800; color:var(--green); font-size:18px; white-space:nowrap; }

  @page{ size:A4; margin:0; }
  @media print{ body{ background:#fff; padding:0; } .page{ box-shadow:none; } }
</style>
</head>
<body>
  <div class="page">
    <div class="brand">
      <img src="/assets/img/app-icon.png" alt="앱 아이콘">
      <div class="nm">교회 재정 관리<small>안드로이드 무료 앱</small></div>
    </div>

    <div class="hero">
      <h1>교회 재정,<br><b>쉽고 투명하게</b></h1>
      <p>목사님과 회계 직분자를 위한 교회 전용 앱</p>
    </div>

    <div class="scan">
      <div class="cue"><span>📷</span>카메라로 QR을 비추세요</div>
      <div class="qrframe">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <img src="/flyer/qr.png" alt="앱 소개·설치 안내 페이지 QR 코드">
      </div>
      <p class="sub">소개부터 설치까지, 이 화면에서 한 번에</p>
      <span class="pill">Google Play 무료 설치</span>
    </div>

    <div class="foot">
      <span>안드로이드 폰에서 설치 · 아이폰은 소개 열람</span>
      <span class="url">church-accounting-landing.netlify.app</span>
    </div>
  </div>
</body>
</html>
